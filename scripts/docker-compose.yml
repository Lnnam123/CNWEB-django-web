version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cointap_postgres
    restart: always
    environment:
      POSTGRES_DB: cointap_db
      POSTGRES_USER: cointap_user
      POSTGRES_PASSWORD: cointap_secure_password_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init_cointap_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  web:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    container_name: cointap_web
    restart: always
    command: >
      sh -c "python manage.py migrate --fake-initial &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 cointap_web.wsgi:application"
    environment:
      USE_POSTGRES: "True"
      POSTGRES_DB: cointap_db
      POSTGRES_USER: cointap_user
      POSTGRES_PASSWORD: cointap_secure_password_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:

